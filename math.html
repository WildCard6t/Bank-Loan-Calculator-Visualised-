 var REG={AU:['en-AU','$'],NZ:['en-NZ','$'],UK:['en-GB','£'],US:['en-US','$'],CA:['en-CA','$']},c0=cfg(),cc=REG[c0.country]?c0.country:'AU';

 function apply(){try{v=localStorage.getItem(K)||v}catch(e){}if(v==='light'||v==='dark')r.dataset.theme=v;else delete r.dataset.theme;sc=cfg().scheme||sc;if(sc!=='indigo')r.dataset.scheme=sc;else delete r.dataset.scheme;bar()}
 function fire(){window.dispatchEvent(new Event('themechange'))}

 window.loanTheme={get:function(){return r.dataset.theme||'auto'},set:function(t){v=t;try{localStorage.setItem(K,t)}catch(e){};apply();fire()},setScheme:function(s){sc=s;var o=cfg();o.scheme=s;try{localStorage.setItem(KS,JSON.stringify(o))}catch(e){};apply();fire()},refresh:function(){apply();fire()},bar:bar};

<style>
/* Math Visualizer (Early Preview): type maths, see a picture. Every keystroke and slider redraws live.
   Pipeline: text -> (LaTeX converter) -> math.js parse -> Scene {kind, fn, params} -> renderer. */
:root{color-scheme:light;--bg:#f4f3f0;--panel:#fff;--ink:#1a1c29;--mute:#5d6074;--line:#e3e1db;--acc:#4f46e5;--soft:#efeefd;--grid:rgba(0,0,0,.07);--axis:rgba(0,0,0,.35);--bad:#d1342f;--shadow:0 1px 2px rgba(26,28,41,.06),0 4px 16px rgba(26,28,41,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0f111a;--panel:#181b27;--ink:#eceef5;--mute:#9ba0b6;--line:#2a2e3f;--acc:#8f88ff;--soft:#22224a;--grid:rgba(255,255,255,.06);--axis:rgba(255,255,255,.35);--bad:#ff6b63;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0f111a;--panel:#181b27;--ink:#eceef5;--mute:#9ba0b6;--line:#2a2e3f;--acc:#8f88ff;--soft:#22224a;--grid:rgba(255,255,255,.06);--axis:rgba(255,255,255,.35);--bad:#ff6b63;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}

  <h1>Math Visualizer <small>Early Preview · v5</small></h1>

<script>
(function(){
const M = math, $ = id => document.getElementById(id);
const COLS = ['#ff5d6c','#ff9d3d','#ffd43b','#35d07f','#4da3ff','#a78bfa','#f472b6'];
const KNOWN = new Set(['x','y','t','theta','e','pi','i','tau','phi','p']);
const EXAMPLES = {
  'Sine Wave':'y = a*sin(b*x)', 'Rose Curve':'r = cos(k*theta)', 'Circle':'x^2 + y^2 = r0^2',
  'Heart':'(x^2 + y^2 - 1)^3 = x^2*y^3', 'Spiral':'r = 0.3*theta', 'Damped Wave':'y = e^(-x/d)*cos(4x)',
  'Lissajous':'(sin(a*t), sin(b*t))', 'Sigmoid':'y = 1/(1 + e^(-k*x))', 'Parabola Family':'y = a*x^2 + b*x + c',
  'LaTeX Demo':'y = \\frac{\\sin x}{x}',
  'Hello':'(-6, -2 + 4*t/(2pi))\n(-4, -2 + 4*t/(2pi))\n(-6 + 2*t/(2pi), 0)\n(-3, -2 + 4*t/(2pi))\n(-3 + 2*t/(2pi), 2)\n(-3 + 1.5*t/(2pi), 0)\n(-3 + 2*t/(2pi), -2)\n(0, -2 + 4*t/(2pi))\n(0 + 2*t/(2pi), -2)\n(3, -2 + 4*t/(2pi))\n(3 + 2*t/(2pi), -2)\n(7 + 1.2cos(t), 2sin(t))'
};
const DEF = {a:1,b:1,c:0,k:3,d:3,r0:3};
/* Word drawings get the Wiggle (line boil) on by default. Add new word presets to this list. */
const WORDS = new Set(['Hello']);
/* Stories: each sentence slides in, wiggles, then slides out as the next one arrives. Longer sentences are drawn smaller.
   To add one: add a line of text to the list. Letters come from the stroke font below. */
const STORIES = {'Hello Story':['HELLO','WELCOME TO MATH VISUALIZER']};

/* lerp(t, a, b, c, ...): walks straight from a to b to c ... as t goes 0 -> 2pi. Lets one equation draw a whole pen stroke. */
M.import({lerp:function(t){const v=[].slice.call(arguments,1),n=v.length-1;if(n<1)return v[0];let u=Math.min(Math.max(t/(2*Math.PI),0),1)*n,i=Math.min(Math.floor(u),n-1);return v[i]+(v[i+1]-v[i])*(u-i)}},{override:true});

/* Stroke font: each letter is a 2 wide x 4 tall box, made of pen strokes (lists of points). 'O' marks an oval. */
const FONT={A:[[0,0,1,4,2,0],[.5,2,1.5,2]],B:[[0,0,0,4,1.5,4,2,3.5,2,2.5,1.5,2,0,2],[1.5,2,2,1.5,2,.5,1.5,0,0,0]],C:[[2,4,0,4,0,0,2,0]],
 D:[[0,0,0,4,1.2,4,2,3,2,1,1.2,0,0,0]],E:[[2,4,0,4,0,0,2,0],[0,2,1.5,2]],F:[[2,4,0,4,0,0],[0,2,1.5,2]],G:[[2,4,0,4,0,0,2,0,2,2,1,2]],
 H:[[0,0,0,4],[2,0,2,4],[0,2,2,2]],I:[[1,0,1,4],[.3,4,1.7,4],[.3,0,1.7,0]],J:[[2,4,2,0,0,0,0,1]],K:[[0,0,0,4],[2,4,0,2,2,0]],L:[[0,4,0,0,2,0]],
 M:[[0,0,0,4,1,2,2,4,2,0]],N:[[0,0,0,4,2,0,2,4]],O:['O'],P:[[0,0,0,4,1.5,4,2,3.5,2,2.5,1.5,2,0,2]],Q:['O',[1.2,1,2,0]],
 R:[[0,0,0,4,1.5,4,2,3.5,2,2.5,1.5,2,0,2],[1,2,2,0]],S:[[2,4,0,4,0,2,2,2,2,0,0,0]],T:[[0,4,2,4],[1,4,1,0]],U:[[0,4,0,0,2,0,2,4]],
 V:[[0,4,1,0,2,4]],W:[[0,4,.5,0,1,2,1.5,0,2,4]],X:[[0,0,2,4],[0,4,2,0]],Y:[[0,4,1,2,2,4],[1,2,1,0]],Z:[[0,4,2,4,0,0,2,0]],
 '!':[[1,4,1,1.2],[1,.4,1,0]],'.':[[1,0,1,.4]],',':[[1.1,.4,.8,-.6]],'?':[[0,3,0,4,2,4,2,2,1,2,1,1.2],[1,.4,1,0]],'-':[[.3,2,1.7,2]],"'":[[1,4,1,3]]};
const STEP=3,FRAME=18;
function sentence(str){
  str=str.toUpperCase();const w=str.length*STEP-1,k=Math.min(1.2,FRAME/w),ox=-w*k/2,f=v=>+v.toFixed(2),out=[];
  [...str].forEach((ch,i)=>{(FONT[ch]||[]).forEach(st=>{const bx=ox+i*STEP*k;
    if(st==='O'){out.push(`(${f(bx+k)} + ${f(k)}*cos(t) + p, ${f(2*k)}*sin(t))`);return}
    const xs=[],ys=[];for(let j=0;j<st.length;j+=2){xs.push(f(bx+st[j]*k));ys.push(f((st[j+1]-2)*k))}
    out.push(`(lerp(t, ${xs.join(', ')}) + p, lerp(t, ${ys.join(', ')}))`)})});
  return out.join('\n');
}
let anim={p:0},story=null;
function stopStory(){if(story){cancelAnimationFrame(story.raf);story=null;anim.p=0}}
function playStory(lines){
  stopStory();setWig(true);view={cx:0,cy:0,s:W()/22};
  const IN=900,HOLD=3200,OUT=900,ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
  story={i:-1,t0:0,raf:0};
  const next=()=>{story.i=(story.i+1)%lines.length;story.t0=performance.now();$('src').value=sentence(lines[story.i]);rebuild();
    $('info').insertAdjacentHTML('afterbegin',`<div class="row"><b>Story: “${esc(lines[story.i])}” (${story.i+1} of ${lines.length})</b></div>`)};
  next();
  const tick=now=>{if(!story)return;const e=now-story.t0,span=W()/view.s;
    if(e<IN)anim.p=span*(1-ease(e/IN));else if(e<IN+HOLD)anim.p=0;else if(e<IN+HOLD+OUT)anim.p=-span*ease((e-IN-HOLD)/OUT);else{next();anim.p=span}
    if(e<IN||e>IN+HOLD)draw();story.raf=requestAnimationFrame(tick)};
  story.raf=requestAnimationFrame(tick);
}

/* ---------- LaTeX -> plain maths (tested 4/4 in groundwork) ---------- */
const FN = 'sin|cos|tan|ln|log|exp|arcsin|arccos|arctan|sinh|cosh|tanh|sec|csc|cot';
function brace(s,i){let d=0;for(let j=i;j<s.length;j++){if(s[j]=='{')d++;else if(s[j]=='}'&&--d==0)return j;}return -1}
function tex(s){
  s=s.replace(/\\left|\\right|\\,|\\;|\\!|\\quad/g,'').replace(/\\cdot|\\times/g,'*').replace(/\\(pi|theta|alpha|beta|tau|phi)/g,' $1 ')
     .replace(new RegExp('\\\\('+FN+')\\s*([a-z0-9]+)(?![(a-z])','g'),'$1($2)').replace(new RegExp('\\\\('+FN+')','g'),'$1')
     .replace(/\\arc(sin|cos|tan)/g,'a$1');
  let k; while((k=s.search(/\\frac\{|\\sqrt\{/))>=0){const isF=s.startsWith('\\frac',k),a=s.indexOf('{',k),b=brace(s,a);
    if(b<0)break;
    if(isF){const c=b+1,d=brace(s,c);if(d<0)break;s=s.slice(0,k)+'(('+s.slice(a+1,b)+')/('+s.slice(c+1,d)+'))'+s.slice(d+1);}
    else s=s.slice(0,k)+'sqrt('+s.slice(a+1,b)+')'+s.slice(b+1);}
  return s.replace(/\{/g,'(').replace(/\}/g,')').replace(/\barc(sin|cos|tan)\b/g,'a$1');
}

/* ---------- text -> Scene ---------- */
function symbols(node){const out=new Set();node.traverse((n,path,parent)=>{if(n.isSymbolNode&&!(parent&&parent.isFunctionNode&&parent.fn===n)&&!(n.name in M&&typeof M[n.name]==='function'))out.add(n.name)});return out}
function compile(txt){const n=M.parse(txt);return {node:n,fn:n.compile(),syms:symbols(n)}}
function classify(line){
  line=line.trim(); if(!line||line.startsWith('#'))return null;
  line=line.replace(/θ/g,'theta').replace(/π/g,'pi').replace(/²/g,'^2').replace(/·|×/g,'*');
  let m=null;if(/^\(.*\)$/.test(line)){let d=0;const inner=line.slice(1,-1);for(let i=0;i<inner.length;i++){const c=inner[i];if(c=='(')d++;else if(c==')')d--;else if(c==','&&d===0){m=[0,inner.slice(0,i),inner.slice(i+1)];break}if(d<0)break}}
  if(m && !line.includes('=')){const X=compile(m[1]),Y=compile(m[2]);return {kind:'param',fx:X.fn,fy:Y.fn,syms:new Set([...X.syms,...Y.syms]),say:'Parametric curve: (x, y) traced as t goes from 0 to 2π.'}}
  const parts=line.split('=');
  if(parts.length>2)throw new Error('Too many = signs');
  if(parts.length===1){const E=compile(parts[0]);
    if(E.syms.has('theta'))return {kind:'polar',f:E.fn,syms:E.syms,say:'Read as r = …, a Polar curve (θ from 0 to 4π).'};
    if(E.syms.has('y'))return {kind:'implicit',f:E.fn,syms:E.syms,say:'Has x and y, drawn where it equals 0.'};
    return {kind:'fx',f:E.fn,syms:E.syms,say:'Read as y = … against x.'};}
  const L=parts[0].trim(), R=compile(parts[1]);
  if(L==='y'&&!R.syms.has('y'))return {kind:'fx',f:R.fn,syms:R.syms,say:'Graph of y against x.'};
  if(L==='r'&&!R.syms.has('r'))return {kind:'polar',f:R.fn,syms:R.syms,say:'Polar curve: distance r at each angle θ (0 to 4π).'};
  if(L==='x'&&!R.syms.has('x')&&R.syms.has('y'))return {kind:'fy',f:R.fn,syms:R.syms,say:'Graph of x against y.'};
  if(/^[a-z]\w*\(x\)$/.test(L))return {kind:'fx',f:R.fn,syms:R.syms,say:'Function of x, graphed as y.'};
  const D=compile('('+parts[0]+')-('+parts[1]+')');
  return {kind:'implicit',f:D.fn,syms:D.syms,say:'An equation in x and y: drawn where both sides are equal.'};
}

/* ---------- state ---------- */
let scenes=[], params={}, view={cx:0,cy:0,s:40};
const cv=$('cv'), ctx=cv.getContext('2d');
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}

function rebuild(){
  const lang=$('lang').value, lines=$('src').value.split('\n');
  scenes=[]; const info=[], need=new Set();
  lines.forEach((raw,i)=>{
    if(!raw.trim())return;
    try{const s=classify(lang==='latex'?tex(raw):raw); if(!s)return; s.col=COLS[scenes.length%COLS.length]; s.src=raw; scenes.push(s);
      s.syms.forEach(v=>{if(!KNOWN.has(v))need.add(v)});
      info.push(`<div class="row"><span class="dot" style="background:${s.col}"></span><span>${esc(s.say)}</span></div>`);
    }catch(e){info.push(`<div class="row err">Line ${i+1}: ${esc(e.message)}</div>`)}
  });
  if(!scenes.length&&!info.length)info.push('<div class="row">Type something like <b>y = x^2</b>.</div>');
  $('info').innerHTML=info.join('');
  // sliders: keep values for letters already present
  const np={}; need.forEach(v=>np[v]=params[v]||{v:DEF[v]??1,min:v==='r0'?0.5:-5,max:v==='r0'?8:5,anim:true,dir:1});
  params=np; drawSliders(); draw();
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function drawSliders(){
  const box=$('sliders'); box.innerHTML='';
  Object.keys(params).forEach(k=>{const p=params[k],d=document.createElement('div');d.className='s';
    d.innerHTML=`<b>${esc(k)}</b><input type="range" min="${p.min}" max="${p.max}" step="0.01" value="${p.v}" aria-label="Slider ${esc(k)}"><output>${p.v.toFixed(2)}</output><input type="checkbox" title="Animate: sweep this Slider back and forth" aria-label="Animate ${esc(k)}" ${p.anim?'checked':''}>`;
    const r=d.querySelector('input'),o=d.querySelector('output'),c=d.querySelector('input[type=checkbox]');
    p.ui={r,o};
    r.oninput=()=>{p.v=+r.value;o.textContent=p.v.toFixed(2);draw()};
    c.onchange=()=>{p.anim=c.checked;animate()};
    box.appendChild(d);});
  animate();
}
/* Animate tick boxes: each ticked Slider sweeps back and forth across its range (about 6 s each way), redrawing live. */
let animRaf=0,animLast=0;
function animate(){if(animRaf)return;animLast=performance.now();
  const step=now=>{const ks=Object.keys(params).filter(k=>params[k].anim);if(!ks.length){animRaf=0;return}
    const dt=Math.min(now-animLast,100)/1000;animLast=now;
    ks.forEach(k=>{const p=params[k],span=p.max-p.min;p.v+=p.dir*span*dt/6;
      if(p.v>p.max){p.v=p.max;p.dir=-1}if(p.v<p.min){p.v=p.min;p.dir=1}
      if(p.ui){p.ui.r.value=p.v;p.ui.o.textContent=p.v.toFixed(2)}});
    draw();animRaf=requestAnimationFrame(step)};
  animRaf=requestAnimationFrame(step)}
function scope(extra){const s={p:anim.p};for(const k in params)s[k]=params[k].v;return Object.assign(s,extra)}
function ev(f,sc){try{const v=f.evaluate(sc);return typeof v==='number'?v:(v&&v.re!==undefined&&Math.abs(v.im)<1e-9?v.re:NaN)}catch(e){return NaN}}

/* ---------- renderer ---------- */
function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);draw()}
function W(){return cv.width/(devicePixelRatio||1)} function H(){return cv.height/(devicePixelRatio||1)}
const X=x=>W()/2+(x-view.cx)*view.s, Y=y=>H()/2-(y-view.cy)*view.s;
const iX=px=>(px-W()/2)/view.s+view.cx, iY=py=>-(py-H()/2)/view.s+view.cy;
function nice(step){const p=Math.pow(10,Math.floor(Math.log10(step))),m=step/p;return (m<2?2:m<5?5:10)*p}
function axes(){
  const w=W(),h=H(),st=nice(60/view.s);ctx.lineWidth=1;ctx.strokeStyle=css('--grid');ctx.beginPath();
  for(let x=Math.ceil(iX(0)/st)*st;x<iX(w);x+=st){ctx.moveTo(X(x),0);ctx.lineTo(X(x),h)}
  for(let y=Math.ceil(iY(h)/st)*st;y<iY(0);y+=st){ctx.moveTo(0,Y(y));ctx.lineTo(w,Y(y))}
  ctx.stroke();ctx.strokeStyle=css('--axis');ctx.beginPath();ctx.moveTo(X(0),0);ctx.lineTo(X(0),h);ctx.moveTo(0,Y(0));ctx.lineTo(w,Y(0));ctx.stroke();
  ctx.fillStyle=css('--mute');ctx.font='11px Geist,system-ui';const fy=Math.min(Math.max(Y(0)+14,14),h-4),fx=Math.min(Math.max(X(0)+4,4),w-30);
  const lab=v=>+v.toPrecision(6)+'';
  for(let x=Math.ceil(iX(0)/st)*st;x<iX(w);x+=st)if(Math.abs(x)>st/2)ctx.fillText(lab(x),X(x)+3,fy);
  for(let y=Math.ceil(iY(h)/st)*st;y<iY(0);y+=st)if(Math.abs(y)>st/2)ctx.fillText(lab(y),fx,Y(y)-3);
}
/* Wiggle: classic hand-drawn "line boil". 3 frames, each bends every point by a slightly different smooth wobble. */
let wig=false,frame=0;const SEEDS=[[0,1.7,3.1],[2.3,0.4,5.2],[4.6,3.9,1.1]];
function wob(px,py){if(!wig)return [px,py];const k=SEEDS[frame];
  return [px+1.8*Math.sin(py*0.045+k[0])+0.8*Math.sin(px*0.11+k[2]), py+1.8*Math.sin(px*0.045+k[1])+0.8*Math.sin(py*0.11+k[0])]}
function stroke(col,fnPts){ctx.strokeStyle=col;ctx.lineWidth=2.5;ctx.shadowColor=col;ctx.shadowBlur=8;ctx.beginPath();let pen=false,last=null;
  fnPts((px,py)=>{if(!isFinite(px)||!isFinite(py)||Math.abs(py)>1e5||Math.abs(px)>1e5){pen=false;return}
    if(pen&&last&&Math.abs(py-last)>H()*1.5){pen=false}
    const q=wob(px,py);if(pen)ctx.lineTo(q[0],q[1]);else ctx.moveTo(q[0],q[1]);pen=true;last=py});
  ctx.stroke();ctx.shadowBlur=0}
function draw(){
  const w=W(),h=H();ctx.clearRect(0,0,w,h);axes();
  scenes.forEach(s=>{
    if(s.kind==='fx')stroke(s.col,P=>{for(let px=0;px<=w;px+=1){const x=iX(px);P(px,Y(ev(s.f,scope({x}))))}});
    else if(s.kind==='fy')stroke(s.col,P=>{for(let py=0;py<=h;py+=1){const y=iY(py);P(X(ev(s.f,scope({y}))),py)}});
    else if(s.kind==='polar')stroke(s.col,P=>{for(let i=0;i<=2000;i++){const t=i/2000*4*Math.PI,r=ev(s.f,scope({theta:t,t}));P(X(r*Math.cos(t)),Y(r*Math.sin(t)))}});
    else if(s.kind==='param')stroke(s.col,P=>{for(let i=0;i<=800;i++){const t=i/800*2*Math.PI,sc=scope({t});P(X(ev(s.fx,sc)),Y(ev(s.fy,sc)))}});
    else if(s.kind==='implicit')implicit(s);
  });
}
/* marching squares: find where f(x,y) changes sign on a grid, join the crossings */
function implicit(s){
  const w=W(),h=H(),c=6,nx=Math.ceil(w/c)+1,ny=Math.ceil(h/c)+1,g=new Float64Array(nx*ny);
  for(let j=0;j<ny;j++)for(let i=0;i<nx;i++)g[j*nx+i]=ev(s.f,scope({x:iX(i*c),y:iY(j*c)}));
  ctx.strokeStyle=s.col;ctx.lineWidth=2.5;ctx.shadowColor=s.col;ctx.shadowBlur=8;ctx.beginPath();
  const L=(a,b)=>a/(a-b);
  for(let j=0;j<ny-1;j++)for(let i=0;i<nx-1;i++){
    const a=g[j*nx+i],b=g[j*nx+i+1],d=g[(j+1)*nx+i],e=g[(j+1)*nx+i+1];
    if(![a,b,d,e].every(isFinite))continue;
    const p=[];
    if((a>0)!==(b>0))p.push([i*c+L(a,b)*c,j*c]);
    if((b>0)!==(e>0))p.push([(i+1)*c,j*c+L(b,e)*c]);
    if((d>0)!==(e>0))p.push([i*c+L(d,e)*c,(j+1)*c]);
    if((a>0)!==(d>0))p.push([i*c,j*c+L(a,d)*c]);
    // skip jumps across asymptotes (huge values both sides)
    if(p.length>=2&&Math.max(Math.abs(a),Math.abs(b),Math.abs(d),Math.abs(e))<1e6){const w=p.map(q=>wob(q[0],q[1]));ctx.moveTo(w[0][0],w[0][1]);ctx.lineTo(w[1][0],w[1][1]);if(p.length===4){ctx.moveTo(w[2][0],w[2][1]);ctx.lineTo(w[3][0],w[3][1])}}
  }
  ctx.stroke();ctx.shadowBlur=0;
}

/* ---------- pan & zoom ---------- */
const pts=new Map();let pinch=null;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.offsetX,y:e.offsetY});cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;
  if(pts.size===1){view.cx-=(e.offsetX-p.x)/view.s;view.cy+=(e.offsetY-p.y)/view.s}
  else if(pts.size===2){const [A,B]=[...pts.values()],d0=Math.hypot(A.x-B.x,A.y-B.y);p.x=e.offsetX;p.y=e.offsetY;const [A2,B2]=[...pts.values()],d1=Math.hypot(A2.x-B2.x,A2.y-B2.y);if(d0>0)zoomAt((A2.x+B2.x)/2,(A2.y+B2.y)/2,d1/d0);return}
  p.x=e.offsetX;p.y=e.offsetY;draw()});
const up=e=>{pts.delete(e.pointerId);cv.style.cursor='grab'};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.offsetX,e.offsetY,Math.exp(-e.deltaY*0.0015))},{passive:false});
function zoomAt(px,py,f){const x=iX(px),y=iY(py);view.s=Math.min(Math.max(view.s*f,0.5),5000);view.cx=x-(px-W()/2)/view.s;view.cy=y+(py-H()/2)/view.s;draw()}
$('zin').onclick=()=>zoomAt(W()/2,H()/2,1.4);$('zout').onclick=()=>zoomAt(W()/2,H()/2,1/1.4);
/* zoom to fit: sample every curve, frame the whole picture with a margin. Plain y = f(x) graphs keep the default -8..8 view. */
function fit(){
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;const add=(x,y)=>{if(isFinite(x)&&isFinite(y)&&Math.abs(x)<1e4&&Math.abs(y)<1e4){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}};
  scenes.forEach(s=>{
    if(s.kind==='param')for(let i=0;i<=400;i++){const t=i/400*2*Math.PI,sc=scope({t});add(ev(s.fx,sc),ev(s.fy,sc))}
    else if(s.kind==='polar')for(let i=0;i<=400;i++){const t=i/400*4*Math.PI,r=ev(s.f,scope({theta:t,t}));add(r*Math.cos(t),r*Math.sin(t))}
    else {add(-8,-8);add(8,8)}});
  if(!(x1>=x0)){view={cx:0,cy:0,s:Math.min(W(),H())/16};draw();return}
  const pad=1.25,wx=Math.max(x1-x0,0.5)*pad,wy=Math.max(y1-y0,0.5)*pad;
  view={cx:(x0+x1)/2,cy:(y0+y1)/2,s:Math.min(W()/wx,H()/wy)};draw();
}
$('zre').onclick=fit;
let wigT=null;$('wig').onclick=()=>setWig(!wig);
function setWig(on){wig=on;$('wig').setAttribute('aria-pressed',wig);$('wig').style.borderColor=wig?'var(--acc)':'';$('wig').style.color=wig?'var(--acc)':'';
  clearInterval(wigT);if(wig)wigT=setInterval(()=>{frame=(frame+1)%3;draw()},110);else draw()}

/* ---------- presets ---------- */
const KEY='mathVisualizer.presets.v1';
function mine(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}}
function load(src,lang){$('lang').value=lang||(src.includes('\\')?'latex':'plain');$('src').value=src;params={};rebuild();fit()}
function chips(){
  const ex=$('examples');ex.innerHTML='';for(const n in EXAMPLES){const b=document.createElement('button');b.type='button';b.textContent=n;b.onclick=()=>{stopStory();load(EXAMPLES[n]);setWig(WORDS.has(n))};ex.appendChild(b)}
  for(const n in STORIES){const b=document.createElement('button');b.type='button';b.textContent='▶ '+n;b.onclick=()=>playStory(STORIES[n]);ex.appendChild(b)}
  const m=$('mine'),p=mine();m.innerHTML='';const names=Object.keys(p);
  if(!names.length)m.innerHTML='<span class="note" style="margin:0">None yet.</span>';
  names.forEach(n=>{const b=document.createElement('button');b.type='button';b.textContent=n;b.onclick=()=>{load(p[n].src,p[n].lang);for(const k in p[n].params||{})if(params[k])params[k].v=p[n].params[k];drawSliders();setWig(!!p[n].wiggle)};
    b.oncontextmenu=e=>{e.preventDefault();if(confirm('Delete preset "'+n+'"?')){const q=mine();delete q[n];localStorage.setItem(KEY,JSON.stringify(q));chips()}};m.appendChild(b)});
}
$('save').onclick=()=>{const n=(prompt('Name this Preset')||'').trim();if(!n)return;const q=mine(),pv={};for(const k in params)pv[k]=params[k].v;
  q[n]={src:$('src').value,lang:$('lang').value,params:pv,wiggle:wig};try{localStorage.setItem(KEY,JSON.stringify(q))}catch(e){alert('Could not save: browser storage is full or blocked.')}chips()};

$('src').addEventListener('input',e=>{stopStory();rebuild();if(e.inputType==='insertFromPaste')fit()});$('lang').addEventListener('change',rebuild);
addEventListener('resize',size);addEventListener('themechange',draw);
chips();$('src').value='y = a*sin(b*x)\nr = cos(k*theta)';
size();view.s=Math.min(W(),H())/16;rebuild();
window.mathVisualizer={tex,classify,get scenes(){return scenes}};
})();
</script>
